[package]
name = "norn"
version = "0.5.0"
edition = "2024"
description = "Prefixes commit messages with Conventional Commits types, decided locally or by TypeSafe's Jev"
repository = "https://github.com/jamiesanson/norn"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
